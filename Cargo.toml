[workspace]
exclude = ["launcher", "crates/anoma-telemetry-server", "crates/anoma-mod-registry", "third_party/wgpu-hal"]
members = [
    "crates/anoma-core",
    "crates/anoma-dualsense",
    "crates/anoma-threads",
    "crates/anoma-hdr",
    "crates/anoma-world",
    "crates/anoma-client",
    "crates/anoma-client-core",
    "crates/anoma-client-input",
    "crates/anoma-command",
    "crates/anoma-items",
    "crates/anoma-server-files",
    "crates/anoma-server",
    "crates/anoma-bots",
    "crates/anoma-assets",
    "crates/anoma-protocol",
    "crates/anoma-theme",
    "crates/anoma-prepare",
    "crates/anoma-telemetry",
    "crates/anoma-bench",
    "crates/anoma-friends",
    "crates/anoma-relay",
    "crates/anoma-mod-sdk",
    "crates/anoma-mods",
    "crates/anoma-mods/tests/guest",
    "crates/anoma-mods/tests/ui_guest",
    "crates/cargo-anoma-mod",
    "crates/anoma-port-pack",
    "crates/anoma-shaders",
    "crates/anoma-shader-api",
    "crates/anoma-release-sign",
    "crates/anoma-mod-sdk/examples/coords-hud",
    "crates/anoma-mod-sdk/examples/predator-missile",
    "crates/anoma-mod-sdk/examples/welcome",
    "crates/anoma-mod-sdk/examples/beacons",
    "mods/official/fps-overlay",
    "mods/official/keystrokes",
    "mods/official/far-view",
    "mods/official/minimap",
    "mods/official/zoom",
    "xtask",
    "mods/official/recipes",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

# Ports mirror vanilla's Java signatures, index loops and nested generic types
# one to one so they can be checked against the decompiled sources.
[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"

# wgpu-hal 30.0.1 with gfx-rs/wgpu#10124: wgpu 30 creates a Vulkan descriptor
# pool with no pool sizes while it creates the device, which Vulkan allows only
# since 1.3.215, and Intel's Windows driver for 6th-10th gen iGPUs (HD 520/530,
# UHD 620/630) crashes on it with an access violation (#746). Drop this and the
# folder once a wgpu release has the fix.
[patch.crates-io]
wgpu-hal = { path = "third_party/wgpu-hal" }

# Line tables keep file:line in backtraces; full debug info made every
# example and test binary hundreds of megabytes and slow to link.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1

# Optimized but quick-to-link builds for iteration: cargo build --profile fast
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
